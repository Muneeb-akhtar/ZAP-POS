<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable on the phone's home screen (Android: Install button; iPhone: Share → Add to Home Screen).
         The manifest link is added by src/account/main.jsx on phones only, so Windows/Mac browsers never offer to install it. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B84F0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZAP POS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />
    <!-- Same theme choice as the landing page, set before first paint -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('zap-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <title>ZAP POS Account</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/account/main.jsx"></script>
  </body>
</html>
