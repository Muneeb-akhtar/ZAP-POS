<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <!-- Same theme choice as the landing page, set before first paint -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('zap-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <title>Invoice · ZAP POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/invoice/main.jsx"></script>
  </body>
</html>
